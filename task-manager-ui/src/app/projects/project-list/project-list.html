<div class="page-container">
  <div class="page-header">
    <h1>Projects</h1>
    <button class="btn btn-primary" (click)="openCreate()">+ New Project</button>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>
  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div *ngIf="!loading && projects.length === 0 && !error" class="empty-state">
    No projects yet. Create your first one!
  </div>

  <div class="project-grid">
    <div class="project-card" *ngFor="let project of projects">
      <div class="project-card-body">
        <h2>{{ project.name }}</h2>
        <p class="description">{{ project.description || 'No description.' }}</p>
        <p class="created-at">Created: {{ project.createdAt | date:'mediumDate' }}</p>
      </div>
      <div class="project-card-actions">
        <a [routerLink]="['/projects', project.id]" class="btn btn-sm btn-secondary">View Tasks</a>
        <button class="btn btn-sm btn-outline" (click)="openEdit(project)">Edit</button>
        <button class="btn btn-sm btn-danger" (click)="confirmDelete(project.id)">Delete</button>
      </div>
    </div>
  </div>
</div>

<app-project-form
  *ngIf="showForm"
  [project]="editingProject"
  (saved)="onFormSaved()"
  (cancelled)="onFormCancelled()">
</app-project-form>

<app-confirm-dialog
  *ngIf="showConfirm"
  message="Are you sure you want to delete this project? All its tasks will be deleted."
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-confirm-dialog>
