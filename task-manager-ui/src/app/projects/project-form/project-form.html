<div class="modal-overlay" (click)="onCancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ project ? 'Edit Project' : 'New Project' }}</h2>
      <button class="btn-close" (click)="onCancel()">×</button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-group">
        <label>Name *</label>
        <input formControlName="name" class="form-control" placeholder="Project name" />
        <span class="error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Name is required (max 200 chars).
        </span>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" class="form-control" rows="3" placeholder="Optional description"></textarea>
      </div>
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
